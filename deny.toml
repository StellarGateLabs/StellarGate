# cargo-deny configuration for StellarGate
# Docs: https://embarkstudios.github.io/cargo-deny/
# Last reviewed: 2026-08-29

# ── Advisories ────────────────────────────────────────────────────────────────
# Mirrors the RustSec advisory database. cargo-deny fetches it automatically.
# Schema version 2: vulnerabilities, unsound and yanked crates are denied by
# default, so only the scope/ignore knobs need to be set explicitly.
[advisories]
version = 2
# Note: the `vulnerability` key was removed in cargo-deny 0.18 (advisories with
# a vulnerability are always denied under schema v2), so it is not set here.
# Check every crate in the tree (not just the workspace) for unmaintained
# advisories — a supply-chain risk for a payments service.
unmaintained = "all"
# Advisories that are acknowledged and accepted, with justification.
#
# Every entry here is a temporary exception, not a permanent waiver. Each must
# carry a removal condition and a review date, and is re-examined on the
# schedule below (see also the weekly `cargo audit` cron in
# .github/workflows/supply-chain.yml). Remove an entry as soon as its removal
# condition is met.
ignore = [
    # RUSTSEC-2023-0071 (rsa, via sqlx-mysql) was ignored here until 2026-09-24.
    # sqlx 0.9 no longer resolves `rsa`, so the ignore was removed together with
    # the matching `ignore:` in .github/workflows/{ci,supply-chain}.yml.
]

# ── Licenses ──────────────────────────────────────────────────────────────────
# Schema version 2: any crate whose license is not in `allow` (or covered by an
# exception) is denied.
[licenses]
version = 2
# Skip the workspace's own unpublished crate (`publish = false`), which is
# intentionally unlicensed; only third-party dependencies are license-checked.
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception", # compiler-builtins and related LLVM crates
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",                             # ring, aws-lc-rs and rustls-webpki, via the rustls TLS stack
    # webpki-root-certs — the Mozilla CA root store. A permissive *data* licence
    # (no copyleft, redistribution unrestricted) covering the certificate set
    # rather than code. Arrives with the rustls stack.
    "CDLA-Permissive-2.0",
    "Unicode-3.0",                     # newer unicode-ident / icu_* releases
    "Zlib",                            # miniz_oxide and compression crates
]
# Note: "OpenSSL" was removed with the move to rustls (reqwest uses its
# `rustls` feature; sqlx's SQLite driver needs no TLS). openssl-sys is no longer in
# the tree, and keeping the allowance would let it return unnoticed.

# ── Bans ──────────────────────────────────────────────────────────────────────
[bans]
# Deny any duplicate version that is not explicitly listed below. This turns
# the allow-list into an enforced contract: adding a new transitive duplicate
# breaks CI, forcing a conscious decision rather than silent bloat.
multiple-versions = "deny"
# Wildcard ("*") version requirements are allowed for now.
wildcards = "allow"

# Known duplicate versions as of 2026-09-24 (re-audited after the axum 0.8,
# sqlx 0.9, reqwest 0.13 and tower-http 0.7 upgrades; stale skips pruned). Every entry below is a
# transitively-forced version split that cannot be resolved without waiting for
# upstream crates to unify on a single major. They are listed here so that
# `multiple-versions = "deny"` above rejects any *new* unregistered duplicate
# while keeping CI green for these known ones.
#
# Removal policy: when a dependency upgrade collapses two versions into one,
# remove the corresponding skip entry so the policy tightens automatically.

[[bans.skip]]
# rand 0.8 is required by governor 0.7; 0.9 is our direct dependency (and
# proptest's); 0.10 (unskipped, so it is the "unique" version) comes from
# axum-test via rust-multipart-rfc7578_2 (dev-only).
# Collapse when governor moves off rand 0.8 (needs a governor major bump).
name = "rand"
version = "=0.8.7"

[[bans.skip]]
name = "rand"
version = "=0.9.5"

[[bans.skip]]
# rand_chacha splits alongside rand majors.
name = "rand_chacha"
version = "=0.3.1"

[[bans.skip]]
name = "rand_chacha"
version = "=0.9.0"

[[bans.skip]]
# rand_core splits alongside rand majors.
name = "rand_core"
version = "=0.6.4"

[[bans.skip]]
name = "rand_core"
version = "=0.9.5"

[[bans.skip]]
name = "rand_core"
version = "=0.10.1"

[[bans.skip]]
# sha2 0.10 / digest 0.10 required by sqlx-core and sqlx-macros-core 0.9;
# sha2 0.11 / digest 0.11 is our direct dependency (with hmac 0.13).
# Collapse when sqlx moves to the RustCrypto 0.11 generation.
name = "sha2"
version = "=0.10.9"

[[bans.skip]]
# digest splits alongside sha2 majors.
name = "digest"
version = "=0.10.7"

[[bans.skip]]
name = "digest"
version = "=0.11.3"

[[bans.skip]]
# crypto-common splits alongside the RustCrypto digest/sha2 version bump.
name = "crypto-common"
version = "=0.1.7"

[[bans.skip]]
name = "crypto-common"
version = "=0.2.2"

[[bans.skip]]
# block-buffer splits alongside the RustCrypto digest/sha2 version bump.
name = "block-buffer"
version = "=0.10.4"

[[bans.skip]]
name = "block-buffer"
version = "=0.12.1"

[[bans.skip]]
# cpufeatures splits across the RustCrypto version bump.
name = "cpufeatures"
version = "=0.2.17"

[[bans.skip]]
name = "cpufeatures"
version = "=0.3.0"

[[bans.skip]]
# tower-http 0.6 required by reqwest 0.13; 0.7 is our direct dependency.
# Collapse when reqwest bumps its tower-http requirement.
name = "tower-http"
version = "=0.6.11"

[[bans.skip]]
# getrandom 0.2 via rand_core 0.6 (governor's rand 0.8); 0.3 via rand_core 0.9
# and tempfile; 0.4 via rand 0.10 and uuid.
name = "getrandom"
version = "=0.2.17"

[[bans.skip]]
name = "getrandom"
version = "=0.3.4"

[[bans.skip]]
name = "getrandom"
version = "=0.4.3"

[[bans.skip]]
# hashbrown: 0.14 via dashmap (moka/governor), 0.16 via sqlx-core/hashlink,
# 0.17 via indexmap.
name = "hashbrown"
version = "=0.14.5"

[[bans.skip]]
name = "hashbrown"
version = "=0.17.1"

[[bans.skip]]
# r-efi splits between two platform-abstraction crate generations.
name = "r-efi"
version = "=5.3.0"

[[bans.skip]]
name = "r-efi"
version = "=6.0.0"

[[bans.skip]]
# syn 2 (sqlx-macros, tracing-attributes, synstructure, expect-json-macros) and
# syn 3 (serde_derive, futures-macro, displaydoc, educe, ...) coexist while
# proc-macro crates migrate. Collapse when all proc-macro deps unify on syn 3.
name = "syn"
version = "=2.0.119"

[[bans.skip]]
name = "syn"
version = "=3.0.3"

[[bans.skip]]
# base64 0.23 required by reqwest 0.13; 0.22 by sqlx-core and (dev-only)
# wiremock. Collapse when sqlx and wiremock move to base64 0.23.
name = "base64"
version = "=0.22.1"

# ── Sources ───────────────────────────────────────────────────────────────────
[sources]
# Only crates.io is an allowed registry. Any git or path dependency that
# slips into Cargo.lock without being explicitly listed here will fail CI.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
