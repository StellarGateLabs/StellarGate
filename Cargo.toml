[package]
name = "stellargate"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

description = "Non-custodial payment gateway API for accepting and settling payments on the Stellar network"
repository = "https://github.com/StellarGateLabs/StellarGate"
homepage = "https://github.com/StellarGateLabs/StellarGate"
readme = "README.md"
license = "MIT"
keywords = ["stellar", "payments", "payment-gateway", "webhooks", "xlm"]
categories = ["web-programming::http-server", "finance"]
# Application binary, not a library published to crates.io. `publish = false`
# lets cargo-deny skip it under `[licenses].private` rather than flagging the
# (intentionally unlicensed) workspace crate itself.
publish = false

[[bin]]
name = "stellargate"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util", "fs"] }
tower-http = { version = "0.7", features = ["cors", "trace", "limit", "request-id", "timeout", "set-header", "compression-gzip", "compression-br"] }
governor = "0.10"
moka = { version = "0.12", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# sqlx 0.9 split the old `runtime-tokio-rustls` feature into `runtime-tokio`
# plus a separate TLS feature. SQLite never opens a network connection, so no
# TLS backend is enabled.
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
futures-util = "0.3"
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
time = { version = "0.3", features = ["parsing"] }
# API key generation. Uses the OS CSPRNG — a UUIDv4 is random but only carries
# 122 bits and encodes a version/variant, so it is the wrong primitive for a
# bearer credential.
rand = "0.10"
# CIDR parsing for TRUSTED_PROXY_CIDRS (X-Forwarded-For trust boundary).
ipnet = "2"


[dev-dependencies]
axum-test = "21"
tokio = { version = "1", features = ["full"] }
time = { version = "0.3", features = ["parsing"] }
wiremock = "0.6.5"
tower = { version = "0.5", features = ["util"] }
proptest = "1.11"
tracing-test = { version = "0.2", features = ["no-env-filter"] }
