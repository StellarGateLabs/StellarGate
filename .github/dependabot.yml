version: 2

updates:
  # Rust dependencies. Grouped so a routine week is one PR to review rather
  # than a dozen — ungrouped bumps get rubber-stamped, which is how a bad
  # dependency slips into a payments service.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
    open-pull-requests-limit: 5
    groups:
      patch-and-minor:
        update-types: ["minor", "patch"]
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"

  # Pinned action SHAs and versions go stale silently and are a real supply
  # chain path into CI.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # The builder image is deliberately pinned to the MSRV, so that what CI
      # compiles on its oldest supported toolchain is what the image ships.
      # Bumping it here achieves nothing anyway: rust-toolchain.toml pins 1.94
      # and outranks the image's own default, so a newer base would simply
      # download 1.94 during the build.
      #
      # Raising the MSRV is a deliberate, coordinated change across
      # Cargo.toml, rust-toolchain.toml, the CI matrix and this Dockerfile —
      # not a dependency bump. Do that by hand.
      - dependency-name: "rust"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
