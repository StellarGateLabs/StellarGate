name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-clippy:
    name: fmt / clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  clippy-advisory:
    name: clippy (advisory / stable)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-stable-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-stable-

      - name: Clippy (stable)
        run: cargo clippy --all-targets -- -D warnings
        env:
          RUSTUP_TOOLCHAIN: stable

  test:
    name: test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [1.88, stable]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.rust }}-

      # Without this the repo's rust-toolchain.toml would pin every matrix leg
      # to the MSRV, so the `stable` leg would silently retest 1.88 and report
      # a green check for a toolchain it never ran.
      - name: Test with locked dependencies
        run: cargo test --locked
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.rust }}

  openapi:
    name: openapi lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Lints the spec's shape (redocly.yaml extends `recommended`). The
      # complementary spec↔router cross-check — that documented paths actually
      # resolve and that the deprecated mount carries its headers — is the
      # `openapi_contract` integration test, which runs in the `test` job above.
      # Major pinned to match what the spec was validated against locally.
      - name: Lint openapi.yaml
        run: npx --yes @redocly/cli@1 lint openapi.yaml

  deploy-consistency:
    name: deploy asset consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches Dockerfile/compose port or healthcheck drift, and a real
      # secret slipping into deploy/stellargate.env.example, before it merges
      # rather than at deploy time (issues #444, #447).
      - name: Check deploy assets against Dockerfile
        run: bash scripts/check-deploy-consistency.sh

  # Belt-and-suspenders alongside supply-chain.yml: running cargo audit
  # directly in CI ensures every PR gets a RustSec advisory scan even without
  # the scheduled weekly supply-chain workflow. Mirrors the same RUSTSEC ignore
  # list kept in supply-chain.yml — see that file for the full triage rationale.
  audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: RUSTSEC-2023-0071

  # Coverage report uploaded as an artifact for inspection.
  # A hard numeric gate can be added here once a baseline is established.
  coverage:
    name: coverage (tarpaulin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coverage-

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Generate coverage report
        run: cargo tarpaulin --locked --out Xml --output-dir coverage/

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
